<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script><script src="/layui/layui.all.js" type="text/javascript"></script><script src="/javascript/header.js" type="text/javascript"></script><script src="/javascript/common.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript">
    $("#chkd").click();
    $(function () {
        $("#form2").submit(function () {
            if ($("#txtUName").val() != "" && $("#txtPassword").val() != "" && $("#TxtSmsCode").val() != "") {
            } else {
                layer.open({
                    content: '请填写全部资料',
                    style: UserUtil.msgStyle,
                    time: 2
                });
                return false;
            }
        });
    });

    //获取验证码
    function getVerify(obj) {
        obj.src = "/file/getVerify?" + Math.random();
    }

    $("#btnRegister").click(function () {
        var username = $("#txtUName").val();
        if (username.isBlank()) {
            $("#LabErr").html("手机号不能为空！");
            return;
        }
        if (!username.isPhone()) {
            $("#LabErr").html("手机号格式不正确！");
            return;
        }
        var password = $("#txtPassword").val();
        if (password.isBlank()) {
            $("#LabErr").html("密码不能为空！");
            return;
        }
        var velCode = $("#TxtChkCode").val();
        if (velCode.isBlank()) {
            $("#LabErr").html("验证码不能为空！");
            return;
        }
        $.ajax({
            type: "POST",
            url: "/user/register",
            data: {"username": username, "password": password,"velCode":velCode},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    $.cookie('Authorization', data.data.token, {path: '/'});
                    window.location.href="/";
                } else {
                    $("#LabErr").html(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })

    })
</script>
