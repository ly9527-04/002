<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script><script src="/layui/layui.all.js" type="text/javascript"></script><script src="/javascript/header.js" type="text/javascript"></script><script src="/javascript/common.js" type="text/javascript"></script>
<script type="text/javascript">
    if(localStorage.getItem("autoLogin")==1){
        $("#autoLogin").attr("checked",'true');
    }else{
        $("#autoLogin").removeAttr("checked");
    }
    $("#btnLogin").click(function () {
        var username = $("#txtUName").val();
        if(username.isBlank()){
            $("#LabErr").html("手机号不能为空！");
            return;
        }
        if(!username.isPhone()){
            $("#LabErr").html("手机号格式不正确！");
            return;
        }
        var password = $("#txtPassword").val();
        if(password.isBlank()){
            $("#LabErr").html("密码不能为空！");
            return;
        }
        $.ajax({
            type: "POST",
            url: "/user/login",
            data: {"username": username, "password": password},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    if($("#autoLogin").is(':checked')){
                        $.cookie('Authorization', data.data.token, { expires: 7 ,path: '/'  });
                        localStorage.setItem("autoLogin","1");
                    }else {
                        $.cookie('Authorization', data.data.token,{ path: '/'  });
                        localStorage.setItem("autoLogin","0");
                    }
                    var orginUrl = getSearchString("originUrl");
                    window.location.href = orginUrl == undefined || orginUrl.isBlank() ? "/" : orginUrl;
                } else {
                    $("#LabErr").html(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })

    })
</script>
